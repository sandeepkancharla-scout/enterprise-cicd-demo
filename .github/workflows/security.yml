name: Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  trivy-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master

        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"