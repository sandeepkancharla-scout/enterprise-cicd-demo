name: CI Pipeline

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    uses: ./.github/workflows/reusable-python-tests.yml

  upload-artifacts:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Test Report

        run: |
          mkdir reports
          echo "CI Pipeline Successful" > reports/test-report.txt

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:
          name: ci-test-report
          path: reports/